openapi: 3.0.3
info:
  title: SeenFlix API
  description: API REST pour la gestion de films et séries avec authentification JWT
  version: 1.0.0
servers:
  - url: http://localhost:9090
    description: Serveur de développement

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email

    Favorite:
      type: object
      properties:
        id:
          type: integer
        movie_id:
          type: integer
        type:
          type: string
          enum: [movie, tv]
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        comment:
          type: string
          maxLength: 500
          nullable: true
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            status:
              type: integer

paths:
  /auth/register:
    post:
      summary: Inscription d'un nouvel utilisateur
      tags: [Authentification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
      responses:
        '201':
          description: Utilisateur créé avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: Authentification
      tags: [Authentification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT access token
        '400':
          description: Données manquantes ou invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Identifiants incorrects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      summary: Renouvellement de l'access token
      tags: [Authentification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token renouvelé
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Refresh token invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /movies/search:
    get:
      summary: Recherche de films/séries
      tags: [Films/Séries]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Mot-clé de recherche
      responses:
        '200':
          description: Résultats de recherche
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        poster_path:
                          type: string
                        overview:
                          type: string
                        release_date:
                          type: string
                        vote_average:
                          type: number
        '400':
          description: Paramètre de recherche manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur lors de l'appel à l'API externe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me/favorites:
    get:
      summary: Liste des favoris de l'utilisateur
      tags: [Favoris]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des favoris
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Favorite'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Ajout d'un favori
      tags: [Favoris]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tmdbId, type]
              properties:
                tmdbId:
                  type: integer
                  minimum: 1
                type:
                  type: string
                  enum: [movie, tv]
                rating:
                  type: integer
                  minimum: 0
                  maximum: 5
                  nullable: true
                comment:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        '201':
          description: Favori ajouté avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  tmdbId:
                    type: integer
                  type:
                    type: string
                  rating:
                    type: integer
                    nullable: true
                  comment:
                    type: string
                    nullable: true
                  message:
                    type: string
        '400':
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Le favori existe déjà
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me/favorites/{id}:
    delete:
      summary: Suppression d'un favori
      tags: [Favoris]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID du favori
      responses:
        '204':
          description: Favori supprimé avec succès
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Favori non trouvé ou non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
